name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck scripts
        run: shellcheck -x scripts/*.sh
      - name: Bash syntax check
        run: bash -n scripts/*.sh
